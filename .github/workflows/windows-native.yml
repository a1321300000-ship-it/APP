name: Build and publish Vault Native for Windows

on:
  push:
    branches: [native-windows]
    paths:
      - 'windows/native/**'
      - '.github/workflows/windows-native.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch or tag to build'
        required: true
        default: 'native-windows'
        type: string
      publish_release:
        description: 'Publish the verified installer to the fixed vault-latest Release'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  build-native:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Configure native Windows build
        shell: pwsh
        run: |
          cmake -S windows/native -B build/native -A x64
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed." }

      - name: Compile native Windows application
        shell: pwsh
        run: |
          cmake --build build/native --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Native Windows compilation failed." }
          $exe = "build/native/Release/VaultNative.exe"
          if (-not (Test-Path $exe)) { throw "VaultNative.exe was not produced." }
          $length = (Get-Item $exe).Length
          if ($length -lt 50000) { throw "The native executable is unexpectedly small: $length bytes." }
          Write-Host "Native executable ready: $length bytes"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }

      - name: Build standalone Windows installer
        shell: pwsh
        run: |
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler was not found." }
          & $compiler "windows/native/installer/VaultNative.iss"
          if ($LASTEXITCODE -ne 0) { throw "Native Windows installer build failed." }
          $setup = "windows/artifacts/Vault-Windows-Native-Setup.exe"
          if (-not (Test-Path $setup)) { throw "The Native Windows installer was not produced." }
          $length = (Get-Item $setup).Length
          if ($length -lt 100000) { throw "The installer is unexpectedly small: $length bytes." }
          if ($length -ge (30 * 1024 * 1024)) { throw "The installer exceeds 30 MB: $length bytes." }
          Write-Host "Standalone installer ready: $length bytes"

      - name: Upload installer backup
        uses: actions/upload-artifact@v4
        with:
          name: vault-windows-native-installer
          path: windows/artifacts/Vault-Windows-Native-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish and verify fixed GitHub Release asset
        if: (github.event_name == 'push' && github.ref == 'refs/heads/native-windows') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view vault-latest
          if ($LASTEXITCODE -ne 0) { throw "The fixed vault-latest Release was not found." }
          $setup = "windows/artifacts/Vault-Windows-Native-Setup.exe"
          gh release upload vault-latest $setup --clobber
          if ($LASTEXITCODE -ne 0) { throw "Uploading the Native Windows installer failed." }
          $assetSize = gh release view vault-latest --json assets --jq '.assets[] | select(.name == "Vault-Windows-Native-Setup.exe") | .size'
          if ([string]::IsNullOrWhiteSpace($assetSize) -or [int64]$assetSize -lt 100000) {
            throw "The Native Windows installer is missing from Release assets."
          }
          $url = "https://github.com/a1321300000-ship-it/APP/releases/download/vault-latest/Vault-Windows-Native-Setup.exe"
          $download = Join-Path $env:RUNNER_TEMP "Vault-Windows-Native-Setup-verified.exe"
          Invoke-WebRequest -Uri $url -OutFile $download
          if (-not (Test-Path $download)) { throw "The Release download check failed." }
          $sourceHash = (Get-FileHash $setup -Algorithm SHA256).Hash
          $downloadHash = (Get-FileHash $download -Algorithm SHA256).Hash
          if ($sourceHash -ne $downloadHash) { throw "The downloaded installer does not match the built installer." }
          Write-Host "Verified Native Windows Release asset: $url"
          Write-Host "SHA256: $sourceHash"
